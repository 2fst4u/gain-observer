id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-21
reason = "glob 11.1.0 via vite-plugin-pwa -> workbox-build; build-time only; no upstream release allows the fixed glob 14.0.2 yet. Accepted by the repository owner on 2026-11-21."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-21
